interface:
  display_name: "Purple Meeting Record"
  short_description: "Purple Sys 的会议与沟通记录整理 skill"
  default_prompt: "使用 $purple-meeting-record 先确认整理档位（全细节、详细、标准、极简；若未明确则先追问），再把 transcript 整理成可筛选的候选要点，并沉成适合 Purple Sys 的 meeting note 与 daily / log 回填草稿。若属于学生沟通场景，还要在 meeting note 与 student log 中显式写出沟通形式、主要汇报内容、沟通建议和触发原因；写入前必须对照 meeting note 中的学生对象检查既有 student log，写入后验证回链，未写入必须说明原因。"
