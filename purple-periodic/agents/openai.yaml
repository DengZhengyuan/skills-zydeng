  default_prompt: "使用 $purple-periodic 按 Purple Sys 的 daily notes、project logs、weekly summaries 和新增文档分层整理和总结周期笔记，而不是扫描整个 vault。读取 daily 时，区分 `今日杂项 / 触发事项` 的事实输入和 `未来几天需要做的事情` 的 7 天短期承诺，不要把短期强调误写成已发生事实。"
